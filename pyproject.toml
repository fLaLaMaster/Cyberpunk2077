[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cp77compat"
version = "0.2.1"
description = "Read-only compatibility scanner for a Vortex-managed Cyberpunk 2077 mod collection"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
cp77compat = "cp77compat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
